pre-commit:
  piped: true
  jobs:
    - name: lint
      glob: '*.{ts,tsx}'
      run: bun run lint:fix {staged_files}
      stage_fixed: true
    - name: format
      run: bun run format:write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: check
      run: bun run check
    - name: www
      root: www/
      run: bunx tsc --noEmit && bun run test
